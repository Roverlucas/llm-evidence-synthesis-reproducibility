  - date: "2026-10-09"
    artifact: analysis/semantic_and_meta_results.json
    change: >
      Added n_estimates_ci_excludes_null per run, needed by the supplement's meta-analytic
      inputs table (k_sig), which until now had no reproducible source. Every pre-existing
      value is unchanged (checked field by field); the definition reproduces the k_sig
      ranges previously reported for the five original stacks and the T=1.0 Claude arm.
  - date: "2026-10-09"
    artifact: analysis/blindage/jev_screening.json
    change: >
      Added chosen_option_probability_range, the metric decision 42 fixed before the arm ran
      (spread of the probability of the chosen option, max - min per abstract). The first
      version of the script reported per-option spreads instead; those values are unchanged.
      Gap found by the independent sa-veritas review.
